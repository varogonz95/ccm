name: wiki

# Mirrors docs/wiki/ into the GitHub wiki (a separate repo, <repo>.wiki.git),
# so the wiki is never edited by hand: changes go through docs/wiki/ and PRs.
# The wiki must exist first: create any page once in the GitHub UI.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write # pushes to the wiki repo

concurrency:
  group: wiki

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          # Wiki URLs have no .md: [x](Commands.md#y) -> [x](Commands#y).
          # Links out of docs/wiki/ point at the file in the repo instead.
          sed -i -E \
            -e "s#\]\(\.\./([^)]*)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/\1)#g" \
            -e 's#\]\(([^):/#]+)\.md(\#[^)]*)?\)#](\1\2)#g' \
            wiki/*.md
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push

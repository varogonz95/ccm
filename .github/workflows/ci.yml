name: ci

# Changes that only touch docs or non-app files (Markdown, docs/, site/,
# .claude/, LICENSE) skip CI. Releases call this via workflow_call, which
# ignores these filters, so a tag always runs the full checks.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**", ".claude/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/**", ".claude/**", "LICENSE*"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
      - run: node --test npm/test/*.test.mjs
